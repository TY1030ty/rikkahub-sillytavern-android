name: Merge Upstream
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ying-3.3.0
      - name: merge huadeng
        run: |
          git config user.name "shadow-merge-bot"
          git config user.email "bot@localhost"
          git remote add upstream https://github.com/MiaoWuNYA/rikkahub-sillytavern-android.git
          git fetch upstream huadeng
          if git merge upstream/huadeng --no-edit; then
            echo "MERGE_OK"
            git push origin HEAD:ying-3.3.0
          else
            echo "===== CONFLICTS ====="
            git diff --name-only --diff-filter=U
            exit 1
          fi
